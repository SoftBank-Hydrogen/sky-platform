<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky 배포 준비</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#182332;background:#f6f8fb}section{background:white;border:1px solid #dbe2eb;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:14px 0}input,button{font:inherit;padding:9px}button{cursor:pointer;margin:8px 8px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5fa;padding:16px}#message{white-space:pre-wrap;color:#a12c20}</style>
<h1>게임 배포 준비</h1><p>ZIP을 분석한 뒤 소스와 배포 계획을 확인하고 승인합니다. 작업 접수 후 실제 배포 실행은 워커 연결이 필요합니다.</p>
<section><label>앱 ID <input id="app" value="tug-test" pattern="[a-z][a-z0-9-]{2,30}"></label><label>게임 ZIP <input id="file" type="file" accept=".zip"></label><label>컨테이너 포트 <input id="port" type="number" value="3000" min="1024" max="65535"></label><label>HTTP 검사 경로 <input id="health" value="/"></label><p>TUG 게임 ZIP은 포트 8080, 검사 경로 /health를 선택하세요.</p><button id="upload">업로드·미리보기</button><button id="reset">새 업로드</button></section>
<p id="message" role="status"></p><section id="review" hidden><h2>배포 계획 확인</h2><pre id="summary"></pre><h3>추가 준비 사항</h3><pre id="blockers"></pre><button id="approve" disabled>이 계획 승인</button><button id="submit" disabled>배포 요청 접수</button><p id="receipt"></p></section>
<script>
const $=id=>document.getElementById(id);let preview=null,approvalId=null,key=null,signature=null;
const storageKey='sky-upload-request-v1';try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(saved){key=saved.key;signature=saved.signature;$('app').value=saved.app;$('port').value=saved.port;$('health').value=saved.health;}}catch{}
function remember(){try{sessionStorage.setItem(storageKey,JSON.stringify({key,signature,app:$('app').value,port:$('port').value,health:$('health').value}));}catch{}}

async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options});const data=await r.json();if(!r.ok)throw Error(data.error||'요청을 처리하지 못했습니다.');return data;}
function show(p){preview=p;approvalId=p.approval_id;$('review').hidden=false;$('summary').textContent=JSON.stringify({id:p.id,status:p.status,application_id:p.application_id,plan:p.plan,inspection:p.inspection,source_digest:p.prepared_ref?.source_digest,expires_at:p.expires_at},null,2);$('blockers').textContent=p.blockers?.length?JSON.stringify(p.blockers,null,2):'추가 준비 사항이 없습니다. 실제 빌드와 실행 검증은 아직 수행하지 않았습니다.';$('approve').disabled=p.status!=='ready'||Boolean(p.blockers?.length)||Boolean(approvalId);$('submit').disabled=!approvalId;history.replaceState(null,'','/prepare?preview='+p.id);}
async function run(action){$('message').textContent='처리 중입니다.';for(const id of ['upload','approve','submit','reset','app','file','port','health'])$(id).disabled=true;try{await action();$('message').textContent='';}catch(e){$('message').textContent=e.message;}finally{for(const id of ['upload','reset','app','file','port','health'])$(id).disabled=false;if(preview)show(preview);}}
$('upload').onclick=()=>run(async()=>{const f=$('file').files[0];if(!f)throw Error('ZIP을 선택하세요.');if(f.size>20*1024*1024)throw Error('ZIP은 20 MiB 이하여야 합니다.');const next=[f.name,f.size,f.lastModified,$('app').value,$('port').value,$('health').value].join('|');if(!key||signature!==next){key=crypto.randomUUID();signature=next;remember();}preview=null;approvalId=null;$('review').hidden=true;$('receipt').textContent='';history.replaceState(null,'','/prepare');const p=await api('/api/deployment-previews',{method:'POST',headers:{'Content-Type':'application/zip','X-Application-Id':$('app').value,'Idempotency-Key':key,'X-Container-Port':$('port').value,'X-Health-Path':$('health').value},body:f});show(p);});
$('approve').onclick=()=>run(async()=>{const a=await api('/api/deployment-previews/'+preview.id+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({preview_digest:preview.preview_digest})});approvalId=a.id;preview.approval_id=a.id;show(preview);});
$('submit').onclick=()=>run(async()=>{const receipt=await api('/api/deployment-approvals/'+approvalId+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_key:'preview:'+preview.id})});$('receipt').textContent='접수된 배포 기록: '+receipt.job_id;});
$('reset').onclick=()=>{preview=null;approvalId=null;key=null;signature=null;try{sessionStorage.removeItem(storageKey);}catch{}$('review').hidden=true;$('message').textContent='';$('receipt').textContent='';history.replaceState(null,'','/prepare');};
const previous=new URLSearchParams(location.search).get('preview');if(previous)run(async()=>show(await api('/api/deployment-previews/'+encodeURIComponent(previous))));
</script></html>
