<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky · 공유 DB 준비</title>
<style>
body{margin:0;background:#f5f6f8;color:#202733;font:16px system-ui,sans-serif}
main{max-width:680px;margin:64px auto;padding:32px;background:white;border-radius:24px}
h1{font-size:28px}p{line-height:1.6;color:#536071}
label{display:block;margin-top:20px}input{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #d9dfe7;border-radius:10px;font:inherit}
button{margin:20px 8px 0 0;padding:12px 20px;background:#3182f6;border:0;border-radius:10px;color:white;font:inherit;cursor:pointer}
button:disabled{background:#aab5c5;cursor:default}#summary,#status{white-space:pre-wrap;line-height:1.6}#status{margin-top:24px}
@media(max-width:720px){main{margin:20px;padding:24px}}
</style>
<main>
<h1>공유 DB 준비</h1>
<p>분석이 끝난 PostgreSQL 앱을 기존 공유 DB 풀에 연결할 준비를 합니다. 앱마다 별도 데이터베이스와 접속 계정을 할당합니다.</p>
<p>여기서 완료되는 단계는 DB 할당입니다. 스키마 이전, 앱의 비밀값 접근 권한, 실행과 HTTP 확인은 이후 배포 단계에서 검증해야 합니다.</p>
<form id="form">
<label>분석 작업 ID<input id="job" pattern="[0-9a-f]{16}" minlength="16" maxlength="16" required autocomplete="off"></label>
<label>앱의 최대 DB 연결 수<input id="limit" type="number" min="1" max="50" value="5" required></label>
<button id="review" type="submit">선택 내용 확인</button>
</form>
<p id="summary" aria-live="polite"></p>
<button id="confirm" disabled>공유 DB 할당 승인</button>
<button id="revoke" disabled>선택 취소</button>
<p id="status" role="status"></p>
</main>
<script>
const el=id=>document.getElementById(id);
let review=null,requestKey=null,timer=null;
async function api(path,body){
  const options={credentials:'same-origin',cache:'no-store'};
  if(body!==undefined){options.method='POST';options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(body)}
  const response=await fetch(path,options),value=await response.json();
  if(!response.ok)throw new Error(value.error||'요청을 처리할 수 없습니다.');
  return value;
}
function stop(){clearTimeout(timer);timer=null}
function reset(){stop();review=null;requestKey=null;el('confirm').disabled=true;el('revoke').disabled=true}
el('form').addEventListener('submit',async event=>{
  event.preventDefault();reset();el('summary').textContent='';el('status').textContent='선택 내용을 확인하고 있습니다.';el('review').disabled=true;
  try{
    review=await api('/api/jobs/'+el('job').value+'/shared-database/review',{connection_limit:Number(el('limit').value)});
    requestKey=crypto.randomUUID();const choice=review.selection,allocation=choice.allocation;
    el('summary').textContent='앱: '+allocation.application_id+'\n공유 풀: '+allocation.pool.id+'\n리전: '+allocation.pool.region+'\n최대 연결: '+allocation.connection_limit+'\n승인 유효 시간: '+new Date(review.expires_at).toLocaleString();
    el('status').textContent='내용을 확인한 뒤 할당을 승인해 주세요.';el('confirm').disabled=false;el('revoke').disabled=false;
  }catch(error){el('status').textContent=error.message}finally{el('review').disabled=false}
});
const labels={queued:'실행 대기 중',running:'DB 할당 중',succeeded:'DB 할당 완료 · 앱 배포 검증은 다음 단계입니다.',failed:'검토 실패 · 선택 내용을 다시 확인해 주세요.',needs_attention:'결과 확인 필요 · 자동 재실행이 중단됐습니다.',revoked:'선택 취소됨',expired:'선택 유효 시간이 지났습니다.'};
async function poll(id){
  try{const value=await api('/api/shared-database-reviews/'+id);el('status').textContent=value.status==='succeeded'&&value.allocation_status!=='allocated'?'완료 기록의 DB 할당 증거를 확인해야 합니다.':labels[value.status]||value.status;
    if(['queued','running'].includes(value.status))timer=setTimeout(()=>poll(id),2000);else el('review').disabled=false;
  }catch(error){el('status').textContent=error.message+' 작업 기록을 확인해 주세요.';el('review').disabled=false}
}
el('confirm').addEventListener('click',async()=>{
  if(!review)return;const id=review.id;el('review').disabled=true;el('confirm').disabled=true;el('revoke').disabled=true;
  try{const receipt=await api('/api/shared-database-reviews/'+id+'/submit',{request_key:requestKey,confirm_allocation:true});
    el('status').textContent='할당 작업 접수됨: '+receipt.operation_id;poll(id);
  }catch(error){el('status').textContent=error.message+' 동일 요청을 재확인하거나 선택을 다시 검토해 주세요.';el('confirm').disabled=false;el('revoke').disabled=false;el('review').disabled=false}
});
el('revoke').addEventListener('click',async()=>{
  if(!review)return;el('revoke').disabled=true;
  try{await api('/api/shared-database-reviews/'+review.id+'/revoke',{});reset();el('status').textContent='선택을 취소했습니다.'}
  catch(error){el('status').textContent=error.message;el('revoke').disabled=false}
});
window.addEventListener('pagehide',stop);
</script>
</html>
