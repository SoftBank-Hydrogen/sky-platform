AWSTemplateFormatVersion: '2010-09-09'
Description: Shared Sky ECR repository and ECS Express Mode roles
Parameters:
  RoleBoundaryArn:
    Type: String
    Default: ''
    Description: Optional Sky-managed permissions boundary for application roles
Conditions:
  HasRoleBoundary: !Not [!Equals [!Ref RoleBoundaryArn, '']]
Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: sky-managed
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: sky-managed
          Value: 'true'
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasRoleBoundary, !Ref RoleBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: sky-managed
          Value: 'true'
  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasRoleBoundary, !Ref RoleBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
      Tags:
        - Key: sky-managed
          Value: 'true'
Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  InfrastructureRoleArn:
    Value: !GetAtt InfrastructureRole.Arn
