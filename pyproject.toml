[project]
name = "sky-platform"
version = "0.1.0"
description = "One action, verified deployments across local and cloud targets"
requires-python = ">=3.12"
dependencies = ["cryptography>=45,<48"]

[project.optional-dependencies]
aws-native = ["boto3>=1.40,<2"]
state-postgres = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sky-platform = "sky_platform:main"
sky-service = "interfaces.service:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sky_platform"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assets = ["static/*", "infra/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: 실계정·실모델 검증. CI에서 실행하지 않는다"]
norecursedirs = ["tests/live", "fixtures"]

[tool.ruff]
line-length = 110
target-version = "py312"
# 기존 런타임은 동작을 유지하며 옮겼다. 새 순수 계층에는 포맷 규칙을 적용한다.
extend-exclude = ["src/application", "src/adapters", "src/interfaces/http", "tests/regression", "tests/live", "tests/support", "tests/fixtures"]
