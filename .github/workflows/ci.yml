name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sky_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: sky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sky_test -d sky_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      postgres-pool:
        image: postgres:17
        env:
          POSTGRES_USER: pool_owner
          POSTGRES_PASSWORD: disposable-pool-password
          POSTGRES_DB: sky_pool_control
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pool_owner -d sky_pool_control"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SKY_TEST_POSTGRES_DSN: "host=127.0.0.1 port=5432 dbname=sky_test user=sky_test password=disposable-test-password sslmode=disable"
      SKY_TEST_POOL_POSTGRES_DSN: "host=127.0.0.1 port=5433 dbname=sky_pool_control user=pool_owner password=disposable-pool-password sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,state-postgres]'
      - name: Check distribution contents
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/sky-wheels .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('/tmp/sky-wheels').glob('sky_platform-*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              files = set(wheel.namelist())
          required = {
              'sky_platform.py', 'interfaces/http/server.py', 'application/agent.py',
              'domain/models.py', 'engine/compatibility.py', 'ports/target.py',
              'adapters/aws/ecs.py', 'adapters/gcp/cloud_run.py',
              'adapters/build/image.py', 'adapters/local/docker.py',
              'adapters/database/sqlite_snapshot.py',
              'assets/static/index.html', 'assets/infra/postgres-migrator.js',
              'interfaces/service.py', 'adapters/state/service_volume.py',
              'ports/state.py', 'adapters/state/records.py', 'adapters/state/postgres.py',
              'ports/operations.py', 'ports/queue.py', 'adapters/state/operations.py',
              'adapters/aws/job_queue.py', 'application/outbox.py',
              'ports/deployment_reads.py', 'adapters/state/deployment_reads.py',
              'application/deployment_reads.py', 'interfaces/http/deployment_reads.py',
              'application/deployment_writes.py',
              'domain/database.py', 'domain/shared_database.py', 'ports/shared_database.py',
              'application/shared_database.py', 'adapters/database/shared_pool.py',
          }
          assert required <= files, sorted(required - files)
          PY
      - run: sky-platform --help
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install observer for actual HTTP integration tests
        working-directory: ops/monitoring/exporter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pytest
        env:
          SKY_TEST_K6_IMAGE: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
      - name: UI and PostgreSQL JavaScript tests
        run: |
          node tests/regression/test_postgres_ui.mjs
          node tests/regression/test_deployment_read_ui.mjs
          node tests/regression/test_postgres_migrator.js
          node tests/regression/test_postgres_restore_verifier.mjs

  service-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Sky service image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: service
          platforms: linux/amd64
          load: true
          tags: sky-platform:${{ github.sha }}
          cache-from: type=gha,scope=sky-service
          cache-to: type=gha,mode=max,scope=sky-service
      - name: Verify service and offline ZIP deployment
        run: python scripts/smoke_service_container.py --image sky-platform:${{ github.sha }} --full
      - name: Export verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save sky-platform:${{ github.sha }} | gzip > sky-service-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: sky-service-image
          path: sky-service-image.tar.gz
          retention-days: 1

  publish-service:
    outputs:
      service_image: ${{ steps.image.outputs.image }}
    # Infra owner supplies these variables. PRs never obtain AWS credentials.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AWS_SERVICE_CI_ROLE_ARN != '' && vars.SKY_SERVICE_ECR_REPOSITORY != ''
    needs: service-image
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sky-service-image
      - run: gunzip -c sky-service-image.tar.gz | docker load
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SERVICE_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Check destination account and repository
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.SKY_SERVICE_ECR_REPOSITORY }}
        run: |
          [[ "$EXPECTED_ACCOUNT" =~ ^[0-9]{12}$ ]]
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$EXPECTED_ACCOUNT" ]]
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Push the verified service image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.SKY_SERVICE_ECR_REPOSITORY }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Infra deployment accepts the first 7 characters of the commit SHA.
          image_tag="${IMAGE_SHA:0:7}"
          [[ "$image_tag" =~ ^[0-9a-f]{7}$ ]]
          image="$REGISTRY/$ECR_REPOSITORY:$image_tag"
          docker tag "sky-platform:$IMAGE_SHA" "$image"
          docker push "$image"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Sky service image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  propose-infra-image:
    # Explicit opt-in: the published ECR account must match the infra deployment account.
    needs: publish-service
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.SKY_INFRA_IMAGE_PR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    concurrency:
      group: sky-infra-image-pr
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Propose the published image to sky-infra
        env:
          GH_TOKEN: ${{ secrets.SKY_INFRA_PR_TOKEN }}
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SERVICE_IMAGE: ${{ needs.publish-service.outputs.service_image }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/propose_infra_image.py
