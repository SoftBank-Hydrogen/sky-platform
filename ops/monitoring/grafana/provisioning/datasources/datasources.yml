apiVersion: 1
datasources:
  - name: Sky Prometheus
    uid: sky-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Sky CloudWatch
    uid: sky-cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: ap-northeast-2
    editable: false
